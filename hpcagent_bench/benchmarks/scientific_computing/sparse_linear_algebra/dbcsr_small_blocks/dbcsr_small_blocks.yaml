# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: derived, upstream: dbcsr, detail: src/mm/dbcsr_mm_csr.F}
# Schema: hpcagent_bench/schemas/bench_spec.schema.yaml
# The dbcsr kernel (same reference and initializer) in the small-block regime: presets M, L and XL use 4x4 blocks at
# block density 0.05, where each block product is a few dozen flops and the work per stored block slot, not the
# block arithmetic, sets the time. dbcsr keeps the 22-32 blocks at density 0.25.
name: DBCSR Small-Block Multiply
short-name: DBCSR Small
level: 3
parameters:
  S:
    n_block_rows: 8
    n_block_cols: 8
    n_block_inner: 8
    block_size: 4
    density: 0.25
  M:
    n_block_rows: 180
    n_block_cols: 180
    n_block_inner: 180
    block_size: 4
    density: 0.05
  L:
    n_block_rows: 321
    n_block_cols: 321
    n_block_inner: 321
    block_size: 4
    density: 0.05
  XL:
    n_block_rows: 574
    n_block_cols: 574
    n_block_inner: 574
    block_size: 4
    density: 0.05
config:
  multrec_limit: {value: 512, selects: tile}
  seed: {value: 0, selects: seed}
args:
  a_index: {shape: "(n_block_rows * n_block_inner, 3)", dtype: int32}
  b_index: {shape: "(n_block_inner * n_block_cols, 3)", dtype: int32}
  a_blocks: {shape: "(n_block_rows * n_block_inner, block_size, block_size)", dtype: float64}
  b_blocks: {shape: "(n_block_inner * n_block_cols, block_size, block_size)", dtype: float64}
  m_sizes: {shape: "(n_block_rows,)", dtype: int32}
  n_sizes: {shape: "(n_block_cols,)", dtype: int32}
  k_sizes: {shape: "(n_block_inner,)", dtype: int32}
  C: {shape: "(n_block_rows * block_size, n_block_cols * block_size)", dtype: float64, out: true}
allowed_precisions:
- fp64
