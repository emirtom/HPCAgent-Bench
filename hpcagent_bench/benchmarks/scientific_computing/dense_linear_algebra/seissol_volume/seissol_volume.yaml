# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: algorithm, upstream: seissol}
# SeisSol ADER-DG volume-integral update of one time step (the contraction of seissol_tensor_contraction,
# applied as Q += dt * upd). NQ (9 elastic quantities) and ND (3 dimensions) are fixed small counts; NBF 56 is
# the order-6 basis; NB at M is not a multiple of a block size. Inputs: initialize() in seissol_volume.py.
name: SeisSol Volume Update
short-name: SeisSol Volume
level: 2
parameters:
  S:
    NB: 64
    NBF: 20
    NQ: 9
    ND: 3
  M:
    NB: 4003
    NBF: 56
    NQ: 9
    ND: 3
  L:
    NB: 40003
    NBF: 56
    NQ: 9
    ND: 3
  XL:
    NB: 160003
    NBF: 56
    NQ: 9
    ND: 3
args:
  dt: {}
  Q: {shape: "(NB, NBF, NQ)", out: true}
  upd: {shape: "(NB, NBF, NQ)", out: true}
  I: "(NB, NBF, NQ)"
  kDivM: "(ND, NBF, NBF)"
  star: "(ND, NQ, NQ)"
