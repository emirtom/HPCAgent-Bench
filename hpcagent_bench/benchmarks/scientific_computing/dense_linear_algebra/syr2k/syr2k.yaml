# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: derived, upstream: polybench, via: [npbench]}
name: Symmetric rank-2k operations
short-name: SYR2K
level: 2
parameters:
  S:
    M: 35
    N: 50
  M:
    M: 1700
    N: 2400
  # XL is bounded by time, not memory: the C reference is the translated triangular update (N^2 M multiply-adds,
  # columns of A and B read at stride M), 39 s at N=3400, M=2393 (gcc-14 -O3 -march=native, EPYC 7A53) and the
  # parallel numba reference 91 s (32 threads). The old XL (12869 x 9056) took ~1100 s (C) and ~5600 s (numba)
  # a rep, past the 300 s per-rep cap for both baselines. Graded inputs drawn in [0.5, 1] x XL run 5-91 s; L sits
  # between M and XL.
  L:
    M: 2017
    N: 2857
  XL:
    M: 2393
    N: 3400
args:
  alpha: {}
  beta: {}
  C: {shape: "(N, N)", out: true}
  A: (N, M)
  B: (N, M)
