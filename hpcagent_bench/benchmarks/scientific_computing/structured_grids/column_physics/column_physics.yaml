# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: original}
# Synthetic column model: per column, a cover recurrence and a tracer recurrence down the levels, then a
# diagnostic pass carried over the levels. KLON at S is not a multiple of any block; NTRAC as in the
# CLOUDSC-style kernels. Inputs, including the fixed cap that makes the tracer clamp bind: initialize() in
# column_physics.py.
name: Column Physics Recurrences
short-name: Column Physics
level: 3
parameters:
  S:
    NLEV: 30
    KLON: 263
    NTRAC: 12
  M:
    NLEV: 137
    KLON: 32771
    NTRAC: 16
  L:
    NLEV: 137
    KLON: 65539
    NTRAC: 16
  XL:
    NLEV: 137
    KLON: 131075
    NTRAC: 16
args:
  tr: {shape: "(NLEV, NTRAC, KLON)", out: true}
  src: "(NLEV, KLON)"
  fall: "(NTRAC,)"
  za: "(NLEV, KLON)"
  pcov: {shape: "(NLEV, KLON)", out: true}
  covc: {shape: "(KLON,)", out: true}
  out: {shape: "(NLEV, KLON)", out: true}
  cap: {}
chain_length:
  tr: NLEV
  out: NLEV
