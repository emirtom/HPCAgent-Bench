# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: derived, upstream: cloudsc, detail: 'dwarf-p-cloudsc cloudsc.F90 4.2, 5.2, 5.3 with NTRAC independent tracers'}
# CLOUDSC-derived: NTRAC tracers sediment down the levels next to a column-only cover recurrence, in one level
# loop. KLON is not a multiple of a block size at any preset; NTRAC >= 4 (tracers 2 and 3 are rain and snow).
# Inputs need structure (fall speeds, dt*g/dp, dry columns, a clamp that binds): initialize() in
# cloudsc_ntrac.py.
name: CLOUDSC NTRAC Sedimentation
short-name: CLOUDSC NTRAC
level: 2
parameters:
  S:
    NLEV: 30
    KLON: 257
    NTRAC: 6
  M:
    NLEV: 137
    KLON: 1031
    NTRAC: 16
  L:
    NLEV: 137
    KLON: 4099
    NTRAC: 16
  XL:
    NLEV: 137
    KLON: 32771
    NTRAC: 16
args:
  q: "(NTRAC, NLEV, KLON)"
  pflux: {shape: "(NTRAC, NLEV, KLON)", out: true}
  vfall: "(NTRAC,)"
  dtgdp: "(NLEV, KLON)"
  rdtgdp: "(NLEV, KLON)"
  rho: "(NLEV, KLON)"
  za: "(NLEV, KLON)"
  prec: "(NLEV, KLON)"
  pcov: {shape: "(NLEV, KLON)", out: true}
chain_length:
  pflux: NLEV
  pcov: NLEV
