# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: derived, upstream: cloudsc, detail: 'dwarf-p-cloudsc f7ba9f8 src/cloudsc_fortran/cloudsc.F90 4.2, 5.2, 5.3, 8'}
# CLOUDSC rain sedimentation (carried down the levels, columns independent) followed by an implicit lateral
# drift of the flux (carried along the column axis, levels independent), eastward or westward per level.
# NCLDTOP = 15 as in the CLOUDSC NumPy port; KLON at S is not a multiple of any block. Source lines and the
# edit: cloudsc_lateral_drift_numpy.py. Structured inputs (monotone pressure, positive temperature, a limiter
# that binds): initialize() in cloudsc_lateral_drift.py.
name: CLOUDSC Lateral Drift
short-name: CLOUDSC Drift
level: 2
parameters:
  S:
    NLEV: 30
    KLON: 263
    NCLDTOP: 15
  M:
    NLEV: 137
    KLON: 32768
    NCLDTOP: 15
  L:
    NLEV: 137
    KLON: 65537
    NCLDTOP: 15
  XL:
    NLEV: 137
    KLON: 131073
    NCLDTOP: 15
args:
  pap: "(NLEV, KLON)"
  paph: "(NLEV + 1, KLON)"
  ztp1: "(NLEV, KLON)"
  zqr: "(NLEV, KLON)"
  pfsnow: "(NLEV + 1, KLON)"
  pfplsx: "(NLEV + 1, KLON)"
  flx: "(NLEV + 1, KLON)"
  outE: "(NLEV + 1, KLON)"
  outW: "(NLEV + 1, KLON)"
  out: {shape: "(NLEV + 1, KLON)", out: true}
  cap: "(NLEV + 1, KLON)"
  east: {shape: "(NLEV + 1,)", dtype: int32}
chain_length:
  out: KLON
