# HPCAgent-Bench benchmark manifest -- adding a benchmark: see README.md.
# provenance: {kind: original}
# Non-separable 3-D box stencil with K^3 taps (K = 2R + 1) on an edge-padded grid, the weighted sum of
# conv_3d with the padding done by the input generator. K is a fixed small count; N at M is not a multiple of
# a block size. Inputs: initialize() in conv3d_box.py.
name: Conv3d Box Stencil
short-name: Conv3d Box
level: 2
parameters:
  S:
    N: 24
    K: 5
  M:
    N: 257
    K: 5
  L:
    N: 385
    K: 5
  XL:
    N: 513
    K: 5
args:
  padded: "(N + K - 1, N + K - 1, N + K - 1)"
  w_box: "(K, K, K)"
  out_grid: {shape: "(N, N, N)", out: true}
